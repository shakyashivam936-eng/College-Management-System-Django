<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f7fb;
            color: #1f2937;
        }
        h1 {
            margin-bottom: 20px;
        }
        .exam-card {
            background: #fff;
            border: 1px solid #dfe7f1;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .exam-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .meta {
            color: #4b5563;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0f172a;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            margin-right: 8px;
        }
        a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Exams</h1>

    {% if exams %}
        {% for exam in exams %}
            <div class="exam-card">
                <div class="exam-title">{{ exam.name }}</div>
                <div class="meta">
                    <span class="badge">{{ exam.exam_type.name }}</span>
                    <span class="badge">{{ exam.course.name }}</span>
                    <span class="badge">Semester {{ exam.semester.semester_number }}</span>
                    <span class="badge">{{ exam.academic_year }}</span>
                </div>
                <div class="meta">
                    {{ exam.start_date }} to {{ exam.end_date }}
                </div>
                <a href="{% url 'exams:exam_result_dashboard' exam.id %}">View Results</a>
            </div>
        {% endfor %}
    {% else %}
        <p>No exams created yet.</p>
    {% endif %}
</body>
</html>
