{% extends 'base.html' %}
{% block title %}Add hostel{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-lg-8"><div class="mb-4"><a class="link-secondary text-decoration-none small" href="{% url 'hostel:hostel_list' %}">← Back to hostels</a><h1 class="page-heading h2 mt-3 mb-1">Add hostel</h1><p class="text-secondary mb-0">Enter the building and warden details.</p></div><section class="card p-4 p-md-5"><form method="post">{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}{{ form.as_p }}<div class="d-flex gap-2 pt-4 border-top mt-4"><button class="btn btn-primary" type="submit">Save hostel</button><a class="btn btn-light" href="{% url 'hostel:hostel_list' %}">Cancel</a></div></form></section></div></div>
{% endblock %}
