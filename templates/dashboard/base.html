<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        College ERP
        {% endblock %}
    </title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #172033;
            color: white;
            overflow-y: auto;
        }

        .logo {
            padding: 22px;
            font-size: 21px;
            font-weight: bold;
            border-bottom: 1px solid #2d3748;
        }

        .menu {
            padding: 15px 10px;
        }

        .menu-title {
            font-size: 12px;
            color: #94a3b8;
            padding: 12px;
            text-transform: uppercase;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            margin-bottom: 5px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 7px;
        }

        .menu a:hover {
            background: #26344d;
            color: white;
        }

        .menu a.active {
            background: #2563eb;
            color: white;
        }

        /* =========================
           MAIN CONTENT
        ========================= */

        .main {
            margin-left: 240px;
            min-height: 100vh;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #e5e7eb;
        }

        .navbar-title {
            font-size: 20px;
            font-weight: bold;
        }

        .admin-user {
            color: #475569;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            padding: 30px;
        }

        /* =========================
           CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(210px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0,0,0,0.06);
        }

        .card-title {
            color: #64748b;
            font-size: 14px;
        }

        .card-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* =========================
           GRID
        ========================= */

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 20px;

            margin-top: 25px;
        }

        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f8fafc;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
            }

            .navbar {
                padding: 0 15px;
            }

            .content {
                padding: 15px;
            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <!-- SIDEBAR -->

    {% include "dashboard/partials/sidebar.html" %}


    <!-- MAIN -->

    <div class="main">

        {% include "dashboard/partials/navbar.html" %}


        <div class="content">

            {% block content %}
            {% endblock %}

        </div>

    </div>


    {% block extra_js %}
    {% endblock %}

</body>

</html>
